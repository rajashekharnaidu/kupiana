<style>
  :root {
    --k-primary:       #cc4e3a;
    --k-primary-hover: #ae3f2d;
    --k-primary-ink:   #c24733;
    --k-secondary:     #7c6a60;
    --k-bg:            #faf6f2;
    --k-surface:       #ffffff;
    --k-border:        #e9dfd6;
    --k-text:          #2c1e16;
    --k-text-muted:    #7b6a5f;
    --k-shadow-lg:     0 20px 60px rgba(74, 44, 30, .14);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: clamp(1.25rem, 4vw, 3rem);
    background:
      radial-gradient(circle at 12% 8%, rgba(204, 78, 58, .10), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(75, 139, 59, .08), transparent 45%),
      var(--k-bg);
    color: var(--k-text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 640px;
    background: var(--k-surface);
    border: 1px solid var(--k-border);
    border-radius: 1.5rem;
    box-shadow: var(--k-shadow-lg);
    padding: clamp(2rem, 5vw, 3.5rem) clamp(1.5rem, 6vw, 3.5rem);
    text-align: center;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 6px;
    background: linear-gradient(90deg, var(--k-primary), #d59120 50%, #4b8b3b);
  }

  .logo {
    width: clamp(64px, 12vw, 84px);
    height: clamp(64px, 12vw, 84px);
    border-radius: 20px;
    margin: 0 auto 1.5rem;
    display: block;
    box-shadow: 0 8px 24px rgba(204, 78, 58, .22);
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    padding: .4rem .9rem;
    border-radius: 999px;
    background: rgba(204, 78, 58, .10);
    color: var(--k-primary-ink);
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 1.25rem;
  }

  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--k-primary);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .35; transform: scale(1.3); }
  }

  h1 {
    font-family: 'Fraunces', 'Inter', serif;
    font-weight: 600;
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    line-height: 1.15;
    margin: 0 0 .75rem;
    color: var(--k-text);
  }

  h1 em {
    font-style: italic;
    color: var(--k-primary-ink);
  }

  .tagline {
    font-size: clamp(1rem, 2.4vw, 1.125rem);
    color: var(--k-text-muted);
    max-width: 34rem;
    margin: 0 auto 2rem;
    line-height: 1.6;
  }

  .divider {
    width: 48px;
    height: 3px;
    border-radius: 999px;
    background: var(--k-border);
    margin: 0 auto 2rem;
  }

  .contact {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .75rem 1rem;
    margin-bottom: 1.75rem;
  }

  .contact a {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    padding: .65rem 1.1rem;
    border-radius: 999px;
    border: 1px solid var(--k-border);
    color: var(--k-text);
    text-decoration: none;
    font-size: .9rem;
    font-weight: 500;
    transition: border-color .2s ease, color .2s ease, background .2s ease, transform .2s ease;
  }

  .contact a:hover {
    border-color: var(--k-primary);
    color: var(--k-primary-ink);
    background: rgba(204, 78, 58, .06);
    transform: translateY(-1px);
  }

  .contact svg { width: 16px; height: 16px; flex: none; }

  .socials {
    display: flex;
    justify-content: center;
    gap: .75rem;
    margin-bottom: 2rem;
  }

  .socials a {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--k-bg);
    border: 1px solid var(--k-border);
    color: var(--k-text-muted);
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .2s ease;
  }

  .socials a:hover {
    background: var(--k-primary);
    border-color: var(--k-primary);
    color: #fff;
    transform: translateY(-2px);
  }

  .socials svg { width: 18px; height: 18px; }

  footer {
    font-size: .8rem;
    color: var(--k-text-muted);
    border-top: 1px solid var(--k-border);
    padding-top: 1.5rem;
  }

  footer p { margin: 0; }

  @media (max-width: 420px) {
    .card { border-radius: 1.125rem; }
    .contact a { font-size: .82rem; padding: .55rem .9rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow .dot { animation: none; }
  }
</style>
</head>
